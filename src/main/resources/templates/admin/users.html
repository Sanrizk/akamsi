<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Kelola Users', ~{::content})}">
<head></head>
<body>
    <div th:fragment="content">

        <!-- Page Title + Add Button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Kelola Users</h3>
                <p class="text-muted mb-0">Manajemen akun Admin, Guru, dan Siswa.</p>
            </div>
            <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addModal">
                <i class="bi bi-plus-lg me-2"></i>Tambah User
            </button>
        </div>

        <!-- Table -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Username</th>
                                <th>Nama Lengkap</th>
                                <th>Role</th>
                                <th class="pe-4 text-end">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td class="ps-4" th:text="${u.id}"></td>
                                <td th:text="${u.username}"></td>
                                <td class="fw-semibold" th:text="${u.namaLengkap}"></td>
                                <td>
                                    <span class="badge rounded-pill px-3 py-2"
                                          th:classappend="${u.role.name() == 'ADMIN' ? 'bg-danger bg-opacity-10 text-danger' : (u.role.name() == 'GURU' ? 'bg-primary bg-opacity-10 text-primary' : 'bg-success bg-opacity-10 text-success')}"
                                          th:text="${u.role}"></span>
                                </td>
                                <td class="pe-4 text-end">
                                    <!-- Edit Button -->
                                    <button class="btn btn-sm btn-outline-warning" data-bs-toggle="modal"
                                            th:data-bs-target="'#editModal' + ${u.id}">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </button>
                                    <!-- Delete Button -->
                                    <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Yakin hapus user ini?')">
                                            <i class="bi bi-trash"></i> Hapus
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ========== EDIT MODALS (one per row) ========== -->
        <div th:each="u : ${users}">
            <div class="modal fade" th:id="'editModal' + ${u.id}" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content border-0 shadow">
                        <form th:action="@{/admin/users/edit/{id}(id=${u.id})}" method="post">
                            <div class="modal-header">
                                <h5 class="modal-title fw-bold">Edit User</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Username</label>
                                    <input type="text" name="username" class="form-control" th:value="${u.username}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Password <small class="text-muted">(kosongkan jika tidak diubah)</small></label>
                                    <input type="password" name="password" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Nama Lengkap</label>
                                    <input type="text" name="namaLengkap" class="form-control" th:value="${u.namaLengkap}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Role</label>
                                    <select name="role" class="form-select" required>
                                        <option value="ADMIN" th:selected="${u.role.name() == 'ADMIN'}">ADMIN</option>
                                        <option value="GURU" th:selected="${u.role.name() == 'GURU'}">GURU</option>
                                        <option value="SISWA" th:selected="${u.role.name() == 'SISWA'}">SISWA</option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ========== ADD MODAL ========== -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <form th:action="@{/admin/users/add}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Tambah User Baru</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nama Lengkap</label>
                            <input type="text" name="namaLengkap" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Role</label>
                            <select name="role" class="form-select" required>
                                <option value="ADMIN">ADMIN</option>
                                <option value="GURU">GURU</option>
                                <option value="SISWA">SISWA</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Tambah</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
