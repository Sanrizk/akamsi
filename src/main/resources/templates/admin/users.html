<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Manajemen Pengguna', ~{::content})}">
<body>
<div th:fragment="content">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Manajemen Pengguna (Admin & Guru)</h3>
            <p class="text-muted mb-0">Kelola akun dan role pengguna sistem.</p>
        </div>
        <div>
            <button type="button" class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#modalTambahUser">
                <i class="bi bi-person-plus-fill me-1"></i> Tambah Pengguna
            </button>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Responsive Table -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold">Daftar Pengguna</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">No</th>
                            <th>Nama Lengkap</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Tanggal Dibuat</th>
                            <th class="pe-4 text-end">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u, iter : ${users}">
                            <td class="ps-4 text-muted" th:text="${iter.count}"></td>
                            <td class="fw-bold text-dark" th:text="${u.namaLengkap}"></td>
                            <td class="text-secondary" th:text="${u.username}"></td>
                            <td>
                                <span th:if="${u.role.name() == 'ADMIN'}" class="badge bg-primary px-3 rounded-pill">ADMIN</span>
                                <span th:if="${u.role.name() == 'GURU'}" class="badge bg-info text-dark px-3 rounded-pill">GURU</span>
                                <span th:if="${u.role.name() == 'SISWA'}" class="badge bg-secondary px-3 rounded-pill">SISWA</span>
                            </td>
                            <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd-MM-yyyy HH:mm') : '-'}"></td>
                            <td class="pe-4 text-end text-nowrap">
                                <button class="btn btn-sm btn-outline-primary me-1 btn-edit-user"
                                        th:data-id="${u.id}"
                                        th:data-username="${u.username}"
                                        th:data-nama="${u.namaLengkap}"
                                        th:data-role="${u.role.name()}">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                                
                                <form th:if="${#authentication.principal.user.id != u.id}" th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" class="d-inline" onsubmit="return confirm('Yakin ingin menghapus pengguna ini secara permanen?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Hapus Pengguna">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${users == null or users.isEmpty()}">
                            <td colspan="6" class="text-center py-5 text-muted">Belum ada data pengguna.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Tambah User -->
    <div class="modal fade" id="modalTambahUser" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <form th:action="@{/admin/users/add}" method="post">
                    <div class="modal-header bg-light">
                        <h5 class="modal-title fw-bold">Tambah Pengguna Baru</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nama Lengkap</label>
                            <input type="text" name="namaLengkap" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Role</label>
                            <select name="role" class="form-select" required>
                                <option value="" disabled selected>-- Pilih Role --</option>
                                <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.name()}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary px-4">Simpan Pengguna</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Edit User -->
    <div class="modal fade" id="modalEditUser" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <form id="formEditUser" th:action="@{/admin/users/edit/0}" method="post">
                    <div class="modal-header bg-light">
                        <h5 class="modal-title fw-bold">Edit Data Pengguna</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nama Lengkap</label>
                            <input type="text" name="namaLengkap" id="editNama" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" id="editUsername" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Role</label>
                            <select name="role" id="editRole" class="form-select" required>
                                <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.name()}"></option>
                            </select>
                        </div>
                        <hr class="my-3">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password Baru (Kosongkan jika tidak ingin mengubah)</label>
                            <input type="password" name="password" class="form-control" placeholder="Ketik password baru">
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary px-4">Perbarui Pengguna</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Client-side Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const editButtons = document.querySelectorAll('.btn-edit-user');
            const formEdit = document.getElementById('formEditUser');
            
            editButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    
                    document.getElementById('editUsername').value = this.getAttribute('data-username');
                    document.getElementById('editNama').value = this.getAttribute('data-nama');
                    document.getElementById('editRole').value = this.getAttribute('data-role');
                    
                    formEdit.action = '/admin/users/edit/' + id;
                    
                    const modal = new bootstrap.Modal(document.getElementById('modalEditUser'));
                    modal.show();
                });
            });
        });
    </script>
</div>
</body>
</html>
