<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AKAMSI - Kelas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">AKAMSI</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin/users">Users</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/akademik/kelas">Kelas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/akademik/mapel">Mapel</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/spp">SPP</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button class="btn btn-outline-light btn-sm mt-1" type="submit">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h3 class="mb-0">Manajemen Kelas</h3>
            </div>
            <div class="card-body">
                <table class="table table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nama Kelas</th>
                            <th>Tahun Ajaran</th>
                            <th>Wali Kelas</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="kelas : ${kelasList}">
                            <td th:text="${kelas.id}"></td>
                            <td th:text="${kelas.namaKelas}"></td>
                            <td th:text="${kelas.tahunAjaran}"></td>
                            <td th:text="${kelas.waliKelas != null ? kelas.waliKelas.user.namaLengkap : '-'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
