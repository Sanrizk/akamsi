<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Manage Kelas', ~{::content})}">
<head></head>
<body>
    <div th:fragment="content">

        <!-- Page Title + Add Button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Kelas & Rombel</h3>
                <p class="text-muted mb-0">Kelola daftar kelas dan tahun ajaran.</p>
            </div>
            <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addModal">
                <i class="bi bi-plus-lg me-2"></i>Tambah Kelas
            </button>
        </div>

        <!-- Table -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Nama Kelas</th>
                                <th>Tahun Ajaran</th>
                                <th class="pe-4 text-end">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="k : ${kelasList}">
                                <td class="ps-4" th:text="${k.id}"></td>
                                <td class="fw-semibold" th:text="${k.namaKelas}"></td>
                                <td th:text="${k.tahunAjaran}"></td>
                                <td class="pe-4 text-end">
                                    <button class="btn btn-sm btn-outline-warning" data-bs-toggle="modal"
                                            th:data-bs-target="'#editModal' + ${k.id}">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </button>
                                    <form th:action="@{/admin/akademik/kelas/delete/{id}(id=${k.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Yakin hapus kelas ini?')">
                                            <i class="bi bi-trash"></i> Hapus
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ========== EDIT MODALS ========== -->
        <div th:each="k : ${kelasList}">
            <div class="modal fade" th:id="'editModal' + ${k.id}" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content border-0 shadow">
                        <form th:action="@{/admin/akademik/kelas/edit/{id}(id=${k.id})}" method="post">
                            <div class="modal-header">
                                <h5 class="modal-title fw-bold">Edit Kelas</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Nama Kelas</label>
                                    <input type="text" name="namaKelas" class="form-control" th:value="${k.namaKelas}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Tahun Ajaran</label>
                                    <input type="text" name="tahunAjaran" class="form-control" th:value="${k.tahunAjaran}" required>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ========== ADD MODAL ========== -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <form th:action="@{/admin/akademik/kelas/add}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Tambah Kelas Baru</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nama Kelas</label>
                            <input type="text" name="namaKelas" class="form-control" placeholder="contoh: Kelas 1A" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Tahun Ajaran</label>
                            <input type="text" name="tahunAjaran" class="form-control" placeholder="contoh: 2026/2027" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Tambah</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
