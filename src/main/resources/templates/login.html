<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AKAMSI</title>
  <link rel="icon" type="image/jpeg" th:href="@{/favicon.jpg}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
              <h3 class="fw-bold mt-2">AKAMSI</h3>
              <p class="text-muted small">Akses Kanal Akademik Manajemen Sistem Informasi</p>
            </div>

            <!-- Login Error Alert -->
            <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-1"></i> Username atau password salah.
            </div>

            <!-- Logout Alert -->
            <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
              <i class="bi bi-check-circle-fill me-1"></i> Anda telah berhasil keluar.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
              <div class="mb-3">
                <label for="username" class="form-label fw-bold">Username / NISN</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" id="username" name="username" class="form-control" placeholder="Masukkan username / NISN" required autofocus>
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-bold">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password" required>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                  <label class="form-check-label small" for="rememberMe">Ingat saya</label>
                </div>
                <a th:href="@{/forgot-password}" class="text-decoration-none small">Lupa password?</a>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Masuk
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Native JavaScript Alert on Password Reset Success -->
  <script th:if="${resetSuccessAlert}" th:inline="javascript">
    /*<![CDATA[*/
    var alertMsg = /*[[${resetSuccessAlert}]]*/ 'Data cocok! Password berhasil di-reset.';
    alert(alertMsg);
    /*]]>*/
  </script>
</body>
</html>
