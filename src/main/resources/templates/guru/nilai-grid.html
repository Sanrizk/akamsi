<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Input Nilai', ~{::content})}">
<body>
<div th:fragment="content">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Input Nilai Siswa</h3>
            <p class="text-muted mb-0">Silakan masukkan skor angka untuk komponen penilaian ini.</p>
        </div>
        <a href="/guru/nilai" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Kembali
        </a>
    </div>

    <!-- Notice: We assume the controller populated 'siswaList' and 'komponenId' for this view -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3 d-flex align-items-center">
            <div class="bg-primary bg-opacity-10 text-primary rounded p-2 me-3">
                <i class="bi bi-journal-check fs-5"></i>
            </div>
            <div>
                <h5 class="mb-0 fw-bold">Komponen Penilaian ID: <span th:text="${komponenId}"></span></h5>
                <small class="text-muted">Masukkan nilai skala 0 - 100.</small>
            </div>
        </div>
        
        <div class="card-body p-0">
            <form th:action="@{/guru/nilai/input/{id}(id=${komponenId})}" method="post">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4" style="width: 5%">No</th>
                                <th style="width: 25%">NISN</th>
                                <th style="width: 45%">Nama Siswa</th>
                                <th class="pe-4 text-end" style="width: 25%">Skor (0-100)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- The Controller should inject 'siswaList' based on the component's class ID -->
                            <tr th:each="s, iter : ${siswaList}">
                                <td class="ps-4 text-muted" th:text="${iter.count}"></td>
                                <td class="fw-medium text-secondary" th:text="${s.nisn}"></td>
                                <td class="fw-bold text-dark" th:text="${s.namaSiswa}"></td>
                                <td class="pe-4 text-end">
                                    <input type="number" 
                                           step="0.1" 
                                           min="0" 
                                           max="100" 
                                           class="form-control form-control-sm ms-auto text-end" 
                                           style="max-width: 120px;" 
                                           th:name="'nilai_' + ${s.id}" 
                                           placeholder="0.0">
                                </td>
                            </tr>
                            <tr th:if="${siswaList == null or siswaList.isEmpty()}">
                                <td colspan="4" class="text-center py-4 text-muted">Belum ada siswa di kelas ini atau data siswa tidak dimuat.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="card-footer bg-light py-3 text-end pe-4 border-0">
                    <button type="submit" class="btn btn-primary px-4 shadow-sm">
                        <i class="bi bi-save me-1"></i> Simpan Semua Nilai
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
