<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Input Nilai Siswa', ~{::content})}">
<head>
  <title>Input Nilai Siswa</title>
</head>
<body>
  <div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-1">
            <li class="breadcrumb-item">
              <a th:href="@{/guru/nilai(kelasId=${komponen.kelas.id}, mapelId=${komponen.mapel.id})}">Penilaian</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Input Nilai</li>
          </ol>
        </nav>
        <h4 class="mb-0 fw-bold" th:text="${komponen.namaKomponen}">Sumatif Bab 1</h4>
      </div>
      <div>
        <span class="badge bg-primary fs-6 me-2" th:text="${komponen.kelas.namaKelas}">Kelas 1A</span>
        <span class="badge bg-secondary fs-6" th:text="${komponen.mapel.namaMapel}">Matematika</span>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form th:action="@{/guru/nilai/input/save}" th:object="${formNilai}" method="post">
          <input type="hidden" th:field="*{komponenId}" />
          <input type="hidden" th:field="*{kelasId}" />
          <input type="hidden" th:field="*{mapelId}" />

          <div th:if="${#lists.isEmpty(formNilai.items)}" class="alert alert-warning text-center my-3">
            <i class="bi bi-exclamation-triangle me-2"></i> Belum ada siswa yang terdaftar di kelas ini. Silakan tambahkan siswa terlebih dahulu melalui menu Admin.
          </div>

          <div th:if="${!#lists.isEmpty(formNilai.items)}">
            <div class="table-responsive mb-3">
              <table class="table table-bordered table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th style="width: 5%;" class="text-center">No</th>
                    <th style="width: 20%;">NISN</th>
                    <th>Nama Siswa</th>
                    <th style="width: 25%;">Nilai (0 - 100)</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="item, stat : *{items}">
                    <td class="text-center" th:text="${stat.count}">1</td>
                    <td th:text="${item.nisn}">00123</td>
                    <td th:text="${item.namaSiswa}" class="fw-bold">Nama Siswa</td>
                    <td>
                      <input type="hidden" th:field="*{items[__${stat.index}__].siswaId}" />
                      <input type="hidden" th:field="*{items[__${stat.index}__].nisn}" />
                      <input type="hidden" th:field="*{items[__${stat.index}__].namaSiswa}" />
                      <input type="number" step="0.1" min="0" max="100" class="form-control"
                             th:field="*{items[__${stat.index}__].nilai}" placeholder="0 - 100" />
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <a th:href="@{/guru/nilai(kelasId=${formNilai.kelasId}, mapelId=${formNilai.mapelId})}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Batal / Kembali
              </a>
              <button type="submit" class="btn btn-success px-4">
                <i class="bi bi-save me-1"></i> Simpan Semua Nilai
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
