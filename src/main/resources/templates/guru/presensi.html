<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Input Presensi', ~{::content})}">
<head></head>
<body>
    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Input Presensi Siswa</h3>
                <p class="text-muted mb-0" th:if="${siswaList != null and !siswaList.isEmpty()}" th:text="'Kelas: ' + ${siswaList[0].kelas.namaKelas} + ' | TA: ' + ${siswaList[0].kelas.tahunAjaran} + ' | Total: ' + ${#lists.size(siswaList)} + ' Siswa'"></p>
                <p class="text-muted mb-0" th:if="${siswaList == null or siswaList.isEmpty()}">Belum ada siswa di kelas Anda.</p>
            </div>
            <div>
                <form class="d-flex" th:action="@{/guru/presensi}" method="get">
                    <input type="date" class="form-control me-2" name="tanggal" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">Daftar Siswa</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">NISN</th>
                                <th>Nama Siswa</th>
                                <th>Status Kehadiran</th>
                                <th>Keterangan</th>
                                <th class="pe-4 text-end">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${siswaList}">
                                <form th:action="@{/guru/presensi/submit}" method="post">
                                    <input type="hidden" name="siswaId" th:value="${s.id}">
                                    <input type="hidden" name="tanggal" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                                    <td class="ps-4 text-muted fw-medium" th:text="${s.nisn}"></td>
                                    <td class="fw-semibold text-dark" th:text="${s.namaSiswa}"></td>
                                    <td>
                                        <select name="status" class="form-select form-select-sm" required>
                                            <option value="HADIR">Hadir</option>
                                            <option value="SAKIT">Sakit</option>
                                            <option value="IZIN">Izin</option>
                                            <option value="ALPA">Alpa</option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="text" name="keterangan" class="form-control form-control-sm" placeholder="Opsional...">
                                    </td>
                                    <td class="pe-4 text-end">
                                        <button type="submit" class="btn btn-sm btn-primary shadow-sm"><i class="bi bi-check2 me-1"></i>Simpan</button>
                                    </td>
                                </form>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
