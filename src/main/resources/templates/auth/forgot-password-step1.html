<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - AKAMSI</title>
  <link rel="icon" type="image/jpeg" th:href="@{/favicon.jpg}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
              <h4 class="fw-bold mt-2">Lupa Password</h4>
              <p class="text-muted small">Masukkan Username atau NISN Anda untuk memulai pemulihan akun.</p>
            </div>

            <!-- Error Alert -->
            <div th:if="${error}" class="alert alert-danger py-2 small" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
            </div>

            <!-- Non-Student Alert -->
            <div th:if="${adminAlert}" class="alert alert-warning py-3" role="alert">
              <div class="d-flex">
                <i class="bi bi-person-x-fill fs-4 me-2 text-warning"></i>
                <div>
                  <strong class="d-block">Pemberitahuan Khusus:</strong>
                  <span class="small" th:text="${adminAlert}"></span>
                </div>
              </div>
            </div>

            <!-- Flash Success Alert (from redirect) -->
            <div th:if="${success}" class="alert alert-success py-2 small" role="alert">
              <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${success}"></span>
            </div>

            <form th:action="@{/forgot-password/check}" method="post">
              <div class="mb-3">
                <label for="username" class="form-label fw-bold">Username / NISN</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Contoh: 0012345678" required autofocus>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                Lanjutkan <i class="bi bi-arrow-right ms-1"></i>
              </button>
            </form>

            <div class="text-center mt-4 pt-2 border-top">
              <a th:href="@{/login}" class="text-decoration-none small text-muted">
                <i class="bi bi-arrow-left me-1"></i> Kembali ke Halaman Login
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
