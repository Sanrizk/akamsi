<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Data Siswa - AKAMSI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <i class="bi bi-person-check-fill text-success" style="font-size: 2.8rem;"></i>
              <h4 class="fw-bold mt-2">Verifikasi Identitas Siswa</h4>
              <p class="text-muted small">Lengkapi data berikut sesuai dengan data pendaftaran sekolah untuk mereset password ke default.</p>
            </div>

            <!-- Error Alert -->
            <div th:if="${error}" class="alert alert-danger py-2 small mb-3" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/forgot-password/reset}" th:object="${dto}" method="post">
              <input type="hidden" th:field="*{username}" />

              <div class="mb-3">
                <label for="nisn" class="form-label fw-bold">NISN</label>
                <input type="text" id="nisn" th:field="*{nisn}" class="form-control" placeholder="Nomor Induk Siswa Nasional" required />
              </div>

              <div class="mb-3">
                <label for="namaSiswa" class="form-label fw-bold">Nama Lengkap Siswa</label>
                <input type="text" id="namaSiswa" th:field="*{namaSiswa}" class="form-control" placeholder="Nama lengkap sesuai raport" required />
              </div>

              <div class="mb-3">
                <label for="namaOrangTua" class="form-label fw-bold">Nama Orang Tua / Wali</label>
                <input type="text" id="namaOrangTua" th:field="*{namaOrangTua}" class="form-control" placeholder="Nama orang tua/wali siswa" required />
              </div>

              <div class="mb-3">
                <label for="noHpOrangTua" class="form-label fw-bold">No. HP Orang Tua</label>
                <input type="text" id="noHpOrangTua" th:field="*{noHpOrangTua}" class="form-control" placeholder="Contoh: 08123456789" required />
                <div class="form-text small">Nomor ini akan otomatis menjadi password login baru Anda.</div>
              </div>

              <div class="mb-4">
                <label for="kelasId" class="form-label fw-bold">Kelas Saat Ini</label>
                <select id="kelasId" th:field="*{kelasId}" class="form-select" required>
                  <option value="" disabled selected>-- Pilih Kelas Anda --</option>
                  <option th:each="k : ${kelasList}" th:value="${k.id}" th:text="${k.namaKelas}">Kelas 1A</option>
                </select>
              </div>

              <button type="submit" class="btn btn-success w-100 py-2 fw-semibold"
                      onclick="return confirm('Apakah Anda yakin data yang diinput sudah benar?')">
                <i class="bi bi-check-circle me-1"></i> Verifikasi & Reset Password
              </button>
            </form>

            <div class="text-center mt-4 pt-2 border-top">
              <a th:href="@{/forgot-password}" class="text-decoration-none small text-muted">
                <i class="bi bi-arrow-left me-1"></i> Ganti Username / Batal
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
