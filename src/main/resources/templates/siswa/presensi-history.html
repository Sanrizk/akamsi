<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Riwayat Kehadiran', ~{::content})}">
<head></head>
<body>
    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Riwayat Kehadiran</h3>
                <p class="text-muted mb-0">Log absensi harian Anda di sekolah.</p>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">Detail Kehadiran</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Tanggal</th>
                                <th>Status</th>
                                <th class="pe-4">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${presensiList}">
                                <td class="ps-4 fw-medium" th:text="${p.tanggal}"></td>
                                <td>
                                    <span th:if="${p.status.name() == 'HADIR'}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-pill px-3 py-1">HADIR</span>
                                    <span th:if="${p.status.name() == 'SAKIT'}" class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 rounded-pill px-3 py-1">SAKIT</span>
                                    <span th:if="${p.status.name() == 'IZIN'}" class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25 rounded-pill px-3 py-1">IZIN</span>
                                    <span th:if="${p.status.name() == 'ALPA'}" class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 rounded-pill px-3 py-1">ALPA</span>
                                </td>
                                <td class="pe-4 text-muted" th:text="${p.keterangan != null ? p.keterangan : '-'}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
