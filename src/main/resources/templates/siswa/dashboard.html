<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Dashboard Siswa', ~{::content})}">
<head></head>
<body>
    <div th:fragment="content">

        <!-- Student Profile Banner -->
        <div class="card shadow-sm border-0 mb-4 overflow-hidden">
            <div class="bg-primary text-white p-4">
                <div class="d-flex align-items-center gap-4">
                    <div class="bg-white text-primary rounded-circle d-flex justify-content-center align-items-center fs-1 fw-bold shadow" style="width: 80px; height: 80px;" th:text="${#strings.substring(siswa.namaSiswa,0,1)}"></div>
                    <div>
                        <h2 class="fw-bold mb-1" th:text="${siswa.namaSiswa}"></h2>
                        <div class="d-flex gap-3 opacity-75">
                            <span><i class="bi bi-person-badge me-1"></i>NISN: <span th:text="${siswa.nisn}"></span></span>
                            <span><i class="bi bi-door-open-fill me-1"></i>Kelas: <span th:text="${siswa.kelas != null ? siswa.kelas.namaKelas : '-'}"></span></span>
                            <span><i class="bi bi-person-video3 me-1"></i>Wali: <span th:text="${siswa.kelas != null and siswa.kelas.waliKelas != null ? siswa.kelas.waliKelas.user.namaLengkap : '-'}"></span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <!-- Quick Actions -->
            <div class="col-md-4">
                <a href="/siswa/presensi" class="text-decoration-none">
                    <div class="card shadow-sm border-0 h-100 bg-white hover-shadow transition">
                        <div class="card-body text-center p-4">
                            <div class="bg-info bg-opacity-10 text-info rounded-circle d-inline-flex p-3 mb-3">
                                <i class="bi bi-calendar-check-fill fs-2"></i>
                            </div>
                            <h5 class="fw-bold text-dark mb-1">Riwayat Kehadiran</h5>
                            <p class="text-muted small mb-0">Lihat histori absensi harian</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="/siswa/rapor" class="text-decoration-none">
                    <div class="card shadow-sm border-0 h-100 bg-white hover-shadow transition">
                        <div class="card-body text-center p-4">
                            <div class="bg-warning bg-opacity-10 text-warning rounded-circle d-inline-flex p-3 mb-3">
                                <i class="bi bi-award-fill fs-2"></i>
                            </div>
                            <h5 class="fw-bold text-dark mb-1">Rapor Akademik</h5>
                            <p class="text-muted small mb-0">Cek nilai akhir semester</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="/siswa/spp" class="text-decoration-none">
                    <div class="card shadow-sm border-0 h-100 bg-white hover-shadow transition">
                        <div class="card-body text-center p-4">
                            <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex p-3 mb-3">
                                <i class="bi bi-wallet2 fs-2"></i>
                            </div>
                            <h5 class="fw-bold text-dark mb-1">Tagihan SPP</h5>
                            <p class="text-muted small mb-0">Status pembayaran bulanan</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>

    </div>
</body>
</html>
