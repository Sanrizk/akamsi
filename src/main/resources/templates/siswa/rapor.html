<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Rapor Digital', ~{::content})}">
<head>
    <style th:fragment="extra_css">
        @media print {
            /* Hide the sidebar, header, flash messages, and standard buttons when printing */
            #sidebar-wrapper, nav.navbar, .alert, .btn-print, .dropdown-form {
                display: none !important;
            }
            /* Expand content to full width */
            #page-content-wrapper, .container-fluid {
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }
            .card {
                border: none !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>
<div th:fragment="content">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Rapor Digital</h3>
            <p class="text-muted mb-0">Capaian hasil belajar akhir semester.</p>
        </div>
        <div class="d-flex gap-2">
            <!-- Semester Dropdown Form -->
            <form class="d-flex dropdown-form" th:action="@{/siswa/rapor}" method="get">
                <select name="semester" class="form-select shadow-sm" onchange="this.form.submit()">
                    <option value="1" th:selected="${semester == 1}">Semester Ganjil (1)</option>
                    <option value="2" th:selected="${semester == 2}">Semester Genap (2)</option>
                </select>
            </form>
            <button class="btn btn-outline-primary btn-print" onclick="window.print()">
                <i class="bi bi-printer-fill me-1"></i> Cetak Rapor
            </button>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-4 border-bottom-0 text-center">
            <h4 class="mb-0 fw-bold">RAPOR HASIL BELAJAR</h4>
            <p class="text-muted mb-0">Nama: <strong class="text-dark" th:text="${siswa.namaSiswa}"></strong> | NISN: <span th:text="${siswa.nisn}"></span></p>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4" style="width: 5%">No</th>
                            <th style="width: 25%">Mata Pelajaran</th>
                            <th class="text-center" style="width: 15%">Nilai Akhir</th>
                            <th class="text-center" style="width: 15%">Predikat</th>
                            <th class="pe-4" style="width: 40%">Deskripsi Capaian</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loop over RaporAkhir records -->
                        <tr th:each="r, stat : ${raporData['raporAkhir']}">
                            <td class="ps-4 fw-medium text-muted" th:text="${stat.count}"></td>
                            <td class="fw-bold text-dark" th:text="${r.mapel.namaMapel}"></td>
                            <td class="text-center fs-5 fw-bold text-primary" th:text="${#numbers.formatDecimal(r.nilaiAkhir, 1, 1)}"></td>
                            <td class="text-center">
                                <span th:if="${r.nilaiAkhir >= 90}" class="badge bg-success fs-6">A</span>
                                <span th:if="${r.nilaiAkhir >= 80 and r.nilaiAkhir < 90}" class="badge bg-primary fs-6">B</span>
                                <span th:if="${r.nilaiAkhir >= 70 and r.nilaiAkhir < 80}" class="badge bg-warning text-dark fs-6">C</span>
                                <span th:if="${r.nilaiAkhir < 70}" class="badge bg-danger fs-6">D</span>
                            </td>
                            <td class="pe-4 text-muted small" th:text="${r.deskripsiCapaian}"></td>
                        </tr>
                        
                        <tr th:if="${raporData['raporAkhir'] == null or raporData['raporAkhir'].isEmpty()}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-file-earmark-x fs-1 d-block mb-2 text-light"></i>
                                Rapor belum tersedia atau belum dikalkulasi untuk semester ini.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
