<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Rapor Digital', ~{::content})}">
<head></head>
<body>
    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Rapor Digital</h3>
                <p class="text-muted mb-0">Hasil pencapaian akademik Anda.</p>
            </div>
            <div>
                <form class="d-flex gap-2" th:action="@{/siswa/rapor}" method="get">
                    <select name="semester" class="form-select shadow-sm" onchange="this.form.submit()">
                        <option value="Ganjil" th:selected="${semester == 'Ganjil'}">Semester Ganjil</option>
                        <option value="Genap" th:selected="${semester == 'Genap'}">Semester Genap</option>
                    </select>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">Detail Nilai - <span th:text="${semester}"></span></h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 text-start">Mata Pelajaran</th>
                                <th>Tugas (30%)</th>
                                <th>UTS (30%)</th>
                                <th>UAS (40%)</th>
                                <th>Nilai Akhir</th>
                                <th class="pe-4">Predikat</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="n : ${nilaiList}">
                                <td class="ps-4 text-start fw-semibold text-dark" th:text="${n.mapel.namaMapel}"></td>
                                <td th:text="${n.nilaiTugas}"></td>
                                <td th:text="${n.nilaiUts}"></td>
                                <td th:text="${n.nilaiUas}"></td>
                                <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(n.nilaiAkhir, 1, 2)}"></td>
                                <td class="pe-4">
                                    <span th:if="${n.nilaiAkhir >= 90}" class="badge bg-success">A</span>
                                    <span th:if="${n.nilaiAkhir >= 80 and n.nilaiAkhir < 90}" class="badge bg-primary">B</span>
                                    <span th:if="${n.nilaiAkhir >= 70 and n.nilaiAkhir < 80}" class="badge bg-warning text-dark">C</span>
                                    <span th:if="${n.nilaiAkhir < 70}" class="badge bg-danger">D</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
