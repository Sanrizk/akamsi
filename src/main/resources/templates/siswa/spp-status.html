<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Status SPP', ~{::content})}">
<head></head>
<body>
    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Status Pembayaran SPP</h3>
                <p class="text-muted mb-0">Riwayat tagihan bulanan sekolah Anda.</p>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">Histori Tagihan</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Bulan/Tahun</th>
                                <th>Tanggal Bayar</th>
                                <th>Jumlah Tagihan</th>
                                <th>Status</th>
                                <th class="pe-4">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${sppList}">
                                <td class="ps-4 fw-semibold text-dark">
                                    <span th:text="${s.bulan}"></span> <small class="text-muted ms-1" th:text="${s.tahun}"></small>
                                </td>
                                <td class="text-muted" th:text="${s.tanggalBayar != null ? s.tanggalBayar : '-'}"></td>
                                <td class="fw-medium" th:text="'Rp ' + ${s.jumlahBayar}"></td>
                                <td>
                                    <span th:if="${s.status.name() == 'LUNAS'}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-pill px-3 py-1">LUNAS</span>
                                    <span th:if="${s.status.name() == 'BELUM_LUNAS'}" class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 rounded-pill px-3 py-1">BELUM LUNAS</span>
                                </td>
                                <td class="pe-4 text-muted small" th:text="${s.catatan != null ? s.catatan : '-'}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
